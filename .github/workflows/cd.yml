# CD = Continuous Delivery / Deployment
# Chỉ chạy khi code được push (hoặc merge PR) vào nhánh main:
#   1. Chạy lại test
#   2. Build Docker image và đẩy lên GitHub Container Registry (ghcr.io)
#   3. Deploy lên máy nội bộ của bạn thông qua self-hosted runner
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch: # cho phép bấm nút "Run workflow" thủ công trên GitHub

# Không cho 2 lần deploy chạy chồng lên nhau
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # cần quyền này để push image lên ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Đăng nhập GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build và push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    # Job này chạy trên CHÍNH MÁY CỦA BẠN (self-hosted runner),
    # nên website chỉ truy cập được trong mạng nội bộ.
    runs-on: self-hosted
    environment: production
    permissions:
      packages: read
    env:
      CONTAINER: internal-portal
      HOST_PORT: 8080
    steps:
      - name: Đăng nhập ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Kéo image mới
        run: docker pull "$IMAGE:${{ github.sha }}"

      - name: Thay container cũ bằng container mới
        run: |
          docker rm -f "$CONTAINER" 2>/dev/null || true
          docker run -d \
            --name "$CONTAINER" \
            --restart unless-stopped \
            -p "$HOST_PORT:3000" \
            "$IMAGE:${{ github.sha }}"

      - name: Kiểm tra website đã chạy
        run: |
          for i in $(seq 1 15); do
            if curl -fs "http://localhost:$HOST_PORT/api/info"; then
              echo
              echo "Deploy thành công: http://$(hostname -I | awk '{print $1}'):$HOST_PORT"
              exit 0
            fi
            sleep 2
          done
          docker logs "$CONTAINER"
          exit 1

      - name: Dọn image cũ
        if: always()
        run: docker image prune -f
